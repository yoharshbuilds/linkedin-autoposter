<!doctype html><html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Helvetica Neue',Arial,sans-serif; background:#fff; }
  #card { width:880px; padding:30px 34px 34px; background:#fff; }
  .title { font-size:23px; font-weight:700; color:#1a1a1a; line-height:1.3; }
  .attr { font-size:13.5px; font-style:italic; color:#6b6b6b; margin-top:7px; margin-bottom:22px; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th { background:#f1f3f4; color:#202124; font-weight:600; text-align:left; padding:11px 14px;
       border:1px solid #d8dade; font-size:13.5px; }
  td { padding:12px 14px; border:1px solid #e4e6e9; color:#202124; vertical-align:top; }
  td.num { font-variant-numeric:tabular-nums; }
  .good { background:#e6f4ea; }
  .bad  { background:#fce8e6; }
  .neutral { background:#fef7e0; }
  tr.total td { font-weight:700; background:#d7ead9; border-top:2px solid #1a7f3c; }
  .foot { font-size:12.5px; color:#6b6b6b; margin-top:14px; line-height:1.5; }
</style></head>
<body><div id="card"></div>
<script>
const D = window.DATA || {
  title:"Sample returns table", attribution:"created by @handle | Source: ...",
  columns:["A","B"], rows:[{cells:["x","y"],tone:""}], footnotes:[]
};
const th = D.columns.map(c=>`<th>${c}</th>`).join("");
const rows = D.rows.map(r=>{
  const cls = r.total ? "total" : (r.tone||"");
  const tds = r.cells.map((c,i)=>`<td class="${i>0?'num':''}">${c}</td>`).join("");
  return `<tr class="${cls}">${tds}</tr>`;
}).join("");
const foot = (D.footnotes||[]).map(f=>`<div class="foot">${f}</div>`).join("");
document.getElementById('card').innerHTML =
  `<div class="title">${D.title}</div><div class="attr">${D.attribution}</div>`+
  `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`+foot;
</script></body></html>
